events {}

http {
    # DNS interno de Docker. Al usar una variable en proxy_pass, nginx vuelve a preguntar
    # y reparte entre las réplicas de appveterinaria (appveterinaria-1, appveterinaria-2, ...).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # Escucha dentro del contenedor. El compose publica este 80 como 8080 en el PC.
        listen 80;

        # http://localhost:8080/veterinaria/api/Auth/Login llega a la API como /api/Auth/Login.
        location /veterinaria/ {
            set $upstream appveterinaria:8080;
            # Quita el prefijo /veterinaria para no cambiar las rutas de los controladores.
            rewrite ^/veterinaria(/.*)$ $1 break;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            # La API usa estos headers para saber la IP y el protocolo originales.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documento OpenAPI. El navegador lo pide en la raíz, sin /veterinaria.
        # http://localhost:8080/openapi/v1.json
        location /openapi/ {
            set $upstream appveterinaria:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Interfaz de la documentación. http://localhost:8080/scalar/v1
        location /scalar {
            set $upstream appveterinaria:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
