# Levanta la imagen, el migrador, dos réplicas y el proxy:
#   docker compose up --build --scale appveterinaria=2
# Lo mismo, leyendo secretos de .env.test en lugar del .env:
#   docker compose --env-file .env.test up --build --scale appveterinaria=2
# Baja contenedores y la red de este proyecto:
#   docker compose down

services:
  # Misma imagen que la API. Aplica las migraciones una vez y el proceso termina.
  # En Docker Desktop queda apagado: eso es el final correcto, no un fallo.
  migrator:
    build: .
    environment:
      # Program.cs migra y, con MIGRATE_ONLY, sale sin abrir el puerto.
      APPLY_MIGRATIONS: "true"
      MIGRATE_ONLY: "true"
      # ${SQL_CONNECTION} se reemplaza con el valor del .env, o del archivo pasado con --env-file.
      ConnectionStrings__ConnectionStringSQLServer: ${SQL_CONNECTION}
    # No lo vuelve a lanzar al terminar. Si falló, el error queda visible y las réplicas no arrancan.
    restart: "no"

  # Réplicas de la API. --scale appveterinaria=3 crea AppVeterinaria-1, 2 y 3.
  appveterinaria:
    build: .
    # Si el proceso se cae, Docker crea de nuevo el mismo contenedor.
    # Un Stop manual lo deja apagado: no vuelve solo.
    restart: unless-stopped
    environment:
      # Development publica Scalar en /scalar/v1. En el contenedor no hay HTTPS.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Program.cs lo junta con el número del hostname: appveterinaria-1 pasa a AppVeterinaria-1.
      INSTANCE_PREFIX: AppVeterinaria
      ConnectionStrings__ConnectionStringSQLServer: ${SQL_CONNECTION}
      # Tokens__Key reemplaza Tokens:Key de appsettings.json. El doble guion bajo es el anidado.
      Tokens__Key: ${TOKENS_KEY}
      # Si el .env no trae emisor o audiencia, se usan localhost y users.
      Tokens__Issuer: ${TOKENS_ISSUER:-localhost}
      Tokens__Audience: ${TOKENS_AUDIENCE:-users}
      Tokens__ExpireMinutes: ${TOKENS_EXPIRE_MINUTES}
    depends_on:
      migrator:
        # Las réplicas esperan a que el migrador termine bien.
        condition: service_completed_successfully
    # El 8080 solo lo ven el proxy y los otros contenedores. No se publica en el PC,
    # así varias réplicas no se pelean el mismo puerto del host.
    expose:
      - "8080"
    # Docker llama a /health. El proxy espera a que responda 200 antes de arrancar.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Única puerta hacia el PC. El cliente llama a localhost:8080 y nginx reparte.
  proxy:
    image: nginx:1.27-alpine
    ports:
      # "8080:80" es puerto del PC : puerto dentro de nginx.
      - "8080:80"
    volumes:
      # Monta la config del repo. :ro es solo lectura.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      appveterinaria:
        # Espera a que /health responda bien.
        condition: service_healthy
